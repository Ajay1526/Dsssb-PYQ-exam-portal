<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Result Analysis</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;font-size:13px}
body{margin:0;background:#f0f0f0;color:#333}
.top{background:#2b2b2b;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.top a{color:#ffcc00}
.wrap{max-width:1000px;margin:15px auto;padding:0 10px}
.card{background:#fff;border:1px solid #ccc;padding:12px;margin-bottom:12px;border-radius:4px;overflow-x:auto}
h3{margin:0 0 8px;color:#31708f}
.cards{display:flex;gap:10px;flex-wrap:wrap}
.k{flex:1;min-width:110px;background:#e8f0f8;padding:10px;text-align:center;border-radius:4px}
.k b{display:block;font-size:18px;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{background:#c6d9f1;border:1px solid #8ea9db;padding:6px}
td{border:1px solid #ccc;padding:6px;text-align:center}
.c{color:#2e7d32;font-weight:bold}.w{color:#d9534f;font-weight:bold}.u{color:#888}
.bar{height:6px;border-radius:3px;margin-top:3px}
.me{background:#33a6ea}.tp{background:#2ecc71}.av{background:#f0ad4e}
button,select{padding:5px 12px;border:1px solid #bbb;background:#fff;cursor:pointer;border-radius:3px}
button.s{background:#33a6ea;color:#fff;border:0}
.sol{background:#fffde7;border:1px solid #ffe082;padding:12px;text-align:left;line-height:1.6;white-space:pre-wrap}
.o{padding:3px 6px;border-radius:3px;margin:3px 0}
.o.ok{background:#d4edda}.o.bad{background:#f8d7da}
.lg span{display:inline-block;width:12px;height:12px;vertical-align:middle;margin:0 3px 0 10px}
</style></head><body>
<div class="top">
  <b>Result Analysis</b>
  <span>
    <select id="att" onchange="render()"></select> 
    <select id="qFilter" onchange="render()">
      <option value="all">All Questions</option>
      <option value="correct">Correct</option>
      <option value="wrong">Wrong</option>
      <option value="unattempted">Unattempted</option>
    </select>
    <select id="lg" onchange="render()"><option value="en">English</option><option value="hi">हिंदी</option></select> 
    <a href="index.html">← Exam Portal</a>
  </span>
</div>
<div class="wrap" id="root"></div>
<script>
const $=id=>document.getElementById(id);
let D=null,A=[];
try{D=JSON.parse(localStorage.getItem('examData'))}catch(e){}
try{A=JSON.parse(localStorage.getItem('examAttempts'))||[]}catch(e){}
const fmt=s=>{s=Math.round(s);return Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s'};
const sum=a=>a.reduce((x,y)=>x+y,0);
if(!A.length){$('root').innerHTML='<div class="card">No attempts found. Please submit a test first.</div>'}
else{
 const want=location.hash.slice(1)||localStorage.getItem('lastAttempt');
 $('att').innerHTML=A.map(a=>`<option value="${a.id}">${a.name} – ${a.date} (Score: ${a.score})</option>`).join('');
 if(A.some(a=>String(a.id)===want))$('att').value=want;else $('att').value=A[A.length-1].id;
 render();
}
function secT(a,i){return a.sections[i]?sum(a.sections[i].q.map(x=>x.t)):0}
function render(){
 const h=$('lg').value==='hi',me=A.find(a=>String(a.id)===$('att').value);
 
 // Calculate Correct, Wrong, Unattempted and 1/4th Negative Marking Score
 let c=0,w=0,u=0,attCount=0;
 me.sections.forEach(s=>s.q.forEach(x=>{if(x.a<0)u++;else{attCount++;if(x.a===x.c)c++;else w++}}));
 
 const accuracy = attCount > 0 ? ((c / attCount) * 100).toFixed(1) : 0;
 let actualScore = (c * 1) - (w * 0.25);
 actualScore = Math.round(actualScore * 100) / 100; // Keep up to 2 decimal places

 const top=A.reduce((b,a)=>a.score>b.score?a:b,A[0]);
 const avgS=i=>sum(A.map(a=>a.sections[i]?secT(a,i):0))/A.length;
 const avgQ=(i,j)=>sum(A.map(a=>a.sections[i]?.q[j]?.t||0))/A.length;
 const tot=sum(me.sections.map((s,i)=>secT(me,i)));
 
 let sortedAttempts=[...A].sort((x,y)=>y.score-x.score);
 let rank=sortedAttempts.findIndex(a=>a.id===me.id)+1;

 const L=h?{sc:'आपका स्कोर (कट-पिट कर)',co:'सही',wr:'गलत',un:'अनअटेम्प्टेड',tt:'कुल समय',tp:'टॉपर स्कोर',av:'औसत छात्र समय',n:'कुल छात्र',sec:'सेक्शन-वार समय और विश्लेषण',q:'प्रश्न-वार समय',sub:'सेक्शन',you:'आपका समय',topT:'टॉपर का समय',avT:'औसत समय',st:'स्थिति',sol:'हल देखें',hide:'हल छुपाएं',ans:'सही उत्तर',your:'आपका उत्तर',none:'कोई नहीं',qn:'प्रश्न',nt:'हल उपलब्ध नहीं है।',rank:'अनुमानित रैंक (Rank)',acc:'एक्यूरेसी (Accuracy)',allQ:'सभी प्रश्न',corr:'सही',wrg:'गलत',unatt:'अनअटेम्प्टेड'}
  :{sc:'Your Score (Net)',co:'Correct',wr:'Wrong',un:'Unattempted',tt:'Total Time',tp:'Top Score',av:'Avg Student Time',n:'Total Students',sec:'Section-wise Time & Analysis',q:'Question-wise Time',sub:'Section',you:'Your Time',topT:'Top Time',avT:'Avg Time',st:'Status',sol:'View Solution',hide:'Hide Solution',ans:'Correct Answer',your:'Your Answer',none:'None',qn:'Question',nt:'No solution available.',rank:'Predicted Rank',acc:'Accuracy',allQ:'All Questions',corr:'Correct',wrg:'Wrong',unatt:'Unattempted'};

 $('qFilter').options[0].text=L.allQ;
 $('qFilter').options[1].text=L.corr;
 $('qFilter').options[2].text=L.wrg;
 $('qFilter').options[3].text=L.unatt;

 const qFilterVal=$('qFilter').value;
 const secName=(s)=>h?(s.nameHi||s.name):s.name;
 
 let o=`<div class="card"><div class="cards">
 <div class="k">${L.sc}<b>${actualScore}</b></div>
 <div class="k">${L.rank}<b>#${rank} / ${A.length}</b></div>
 <div class="k">${L.acc}<b>${accuracy}%</b></div>
 <div class="k">${L.co}<b class="c">${c}</b></div>
 <div class="k">${L.wr}<b class="w">${w}</b></div>
 <div class="k">${L.un}<b>${u}</b></div>
 <div class="k">${L.tt}<b>${fmt(tot)}</b></div></div>
 <p class="lg" style="margin-top:10px"><span class="me"></span>${L.you}<span class="tp"></span>${L.topT}<span class="av"></span>${L.avT}</p></div>`;

 // Section-wise Time & Performance table (with Section Score & Accuracy)
 o+=`<div class="card"><h3>${L.sec}</h3><table><tr><th>${L.sub}</th><th>Score</th><th>${L.acc}</th><th>${L.you}</th><th>${L.topT}</th><th>${L.avT}</th></tr>`;
 me.sections.forEach((s,i)=>{
  let sC=0, sW=0, sAtt=0;
  s.q.forEach(x=>{if(x.a>=0){sAtt++;if(x.a===x.c)sC++;else sW++}});
  let sAcc = sAtt > 0 ? ((sC / sAtt) * 100).toFixed(1) : 0;
  let sScore = (sC * 1) - (sW * 0.25);
  sScore = Math.round(sScore * 100) / 100;

  const a=secT(me,i),t=top.sections[i]?secT(top,i):0,v=avgS(i),m=Math.max(a,t,v,1);
  const bar=(x,cl)=>`<div class="bar ${cl}" style="width:${x/m*100}%"></div>`;
  o+=`<tr><td><b>${secName(s)}</b></td><td>${sScore}</td><td><b>${sAcc}%</b></td><td>${fmt(a)}${bar(a,'me')}</td><td>${fmt(t)}${bar(t,'tp')}</td><td>${fmt(v)}${bar(v,'av')}</td></tr>`
 });
 o+='</table></div>';

 // Question-wise Detailed breakdown with filter logic
 me.sections.forEach((s,i)=>{
  let filteredQs = s.q.map((x, originalIdx) => ({x, originalIdx})).filter(({x}) => {
   if(qFilterVal==='correct') return x.a === x.c;
   if(qFilterVal==='wrong') return x.a >= 0 && x.a !== x.c;
   if(qFilterVal==='unattempted') return x.a < 0;
   return true;
  });

  if(filteredQs.length > 0) {
   o+=`<div class="card"><h3>${L.q} – ${secName(s)}</h3><table><tr><th>${L.qn}</th><th>${L.st}</th><th>${L.you}</th><th>${L.topT}</th><th>${L.avT}</th><th></th></tr>`;
   filteredQs.forEach(({x, originalIdx})=>{
    const j=originalIdx;
    const t=top.sections[i]?.q[j]?.t||0,v=avgQ(i,j),m=Math.max(x.t,t,v,1);
    const st=x.a<0?`<span class="u">${L.un}</span>`:x.a===x.c?`<span class="c">${L.co}</span>`:`<span class="w">${L.wr}</span>`;
    const bar=(y,cl)=>`<div class="bar ${cl}" style="width:${y/m*100}%"></div>`;
    o+=`<tr><td>${j+1}</td><td>${st}</td><td>${fmt(x.t)}${bar(x.t,'me')}</td><td>${fmt(t)}${bar(t,'tp')}</td><td>${fmt(v)}${bar(v,'av')}</td><td><button class="s" id="b${i}_${j}" onclick="tog(${i},${j})">${L.sol}</button></td></tr>
    <tr id="r${i}_${j}" style="display:none"><td colspan="6">${solHTML(i,j,x,h,L)}</td></tr>`});
   o+='</table></div>';
  }
 });
 
 const open=[...document.querySelectorAll('[id^=r][style*="table-row"]')].map(e=>e.id);
 $('root').innerHTML=o;
 window._L=L;
 open.forEach(id=>{const e=$(id);if(e){e.style.display='table-row';$('b'+id.slice(1)).textContent=L.hide}});
}

function solHTML(i,j,x,h,L){
 const secObj=D&&D.sections[i];
 const q=secObj?secObj.questions[j]:null;
 if(!q)return L.nt;
 const opts=(h?q.optHi:q.optEn).map((t,k)=>`<div class="o ${k===q.ans?'ok':(k===x.a?'bad':'')}">${String.fromCharCode(65+k)}. ${t.replace(/</g,'&lt;')}${k===q.ans?' ✔':''}${k===x.a?' ◀ '+L.your:''}</div>`).join('');
 const sol=(h?q.solHi:q.solEn)||'';
 return `<div class="sol"><b>Q.${j+1}) ${(h?q.qHi:q.qEn).replace(/</g,'&lt;')}</b>${opts}<div style="margin-top:6px"><b>${L.ans}:</b> ${String.fromCharCode(65+q.ans)} &nbsp; <b>${L.your}:</b> ${x.a<0?L.none:String.fromCharCode(65+x.a)}</div>${sol?`<div style="margin-top:6px">${sol.replace(/</g,'&lt;')}</div>`:''}</div>`}

function tog(i,j){const r=$('r'+i+'_'+j),b=$('b'+i+'_'+j),sh=r.style.display==='none';r.style.display=sh?'table-row':'none';b.textContent=sh?_L.hide:_L.sol}
</script></body></html>
