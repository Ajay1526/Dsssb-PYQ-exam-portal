<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Login | DSSSB Exam Portal</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #eef3f8;
      color: #233044;
      font-family: Arial, sans-serif;
    }
    .login-card {
      width: min(100%, 390px);
      padding: 30px;
      border: 1px solid #d8e0ea;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 35px rgba(31, 55, 82, .12);
    }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .intro { margin: 0 0 24px; color: #627187; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #bdc9d8;
      border-radius: 6px;
      font: inherit;
    }
    input:focus { outline: 3px solid #cfe7ff; border-color: #2786d1; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 12px;
      border: 0;
      border-radius: 6px;
      background: #1684d4;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #096db5; }
    .hint, .warning { font-size: 13px; line-height: 1.5; }
    .hint { margin: 18px 0 0; color: #627187; }
    .warning { margin: 14px 0 0; color: #8a5b00; }
    .error { min-height: 20px; margin: 12px 0 0; color: #b42318; }
    #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="login-card" id="loginPanel">
    <h1>DSSSB Exam Portal</h1>
    <p class="intro">Sign in to begin the demo exam.</p>
    <form id="loginForm">
      <label for="userId">Candidate ID</label>
      <input id="userId" name="userId" autocomplete="username" value="11111" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" value="12345" required>

      <p class="error" id="loginError" role="alert" aria-live="polite"></p>
      <button type="submit">Sign in</button>
    </form>
    <p class="hint">Demo credentials: Candidate ID <strong>11111</strong>, password <strong>12345</strong>.</p>
    <p class="warning"><strong>Demo only:</strong> credentials are checked in browser code. This is not secure authentication and must not be used to protect real accounts or data.</p>
  </main>

  <iframe id="portal" title="DSSSB exam portal" src="index.html" hidden></iframe>

  <script>
    const DEMO_USER = '11111';
    const DEMO_PASSWORD = '12345';

    document.getElementById('loginForm').addEventListener('submit', event => {
      event.preventDefault();
      const userId = document.getElementById('userId').value.trim();
      const password = document.getElementById('password').value;
      const error = document.getElementById('loginError');

      if (userId !== DEMO_USER || password !== DEMO_PASSWORD) {
        error.textContent = 'Invalid demo credentials. Please check the ID and password.';
        return;
      }

      const portal = document.getElementById('portal');
      const openExam = () => {
        try {
          portal.contentWindow.goTo(2);
          document.getElementById('loginPanel').hidden = true;
          portal.hidden = false;
        } catch (e) {
          error.textContent = 'The exam portal could not be opened. Please reload and try again.';
        }
      };

      if (portal.contentWindow && typeof portal.contentWindow.goTo === 'function') {
        openExam();
      } else {
        portal.addEventListener('load', openExam, { once: true });
      }
    });
  </script>
</body>
</html>
